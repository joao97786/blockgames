<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Games - Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .page { display: none; }
        .page.active { display: flex; flex-direction: column; min-height: 100vh; }
    </style>
</head>
<body class="bg-indigo-900">

    <div id="loginPage" class="page active items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center transform transition-all">
            <h1 class="text-3xl font-bold text-indigo-900 mb-2">Block Games</h1>
            <p class="text-gray-500 mb-6">Digite seu nome para entrar</p>
            <input type="text" id="loginUser" placeholder="Nome de Usuário" class="w-full p-3 border rounded-lg mb-6">
            <button onclick="realizarLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">Entrar</button>
        </div>
    </div>

    <div id="appPage" class="page bg-gray-100">
        <nav class="bg-indigo-700 p-4 shadow-lg text-white">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fas fa-gamepad"></i> <span id="userNameDisplay">Block Games</span>
                </h1>
                <div class="flex gap-3">
                    <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-white text-indigo-700 px-4 py-2 rounded-full font-bold text-sm">+ Novo Jogo</button>
                    <button onclick="handleLogout()" class="text-white text-xs hover:underline">Sair</button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto p-4 flex-grow">
            <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4"></div>
        </div>
    </div>

    <script>
        let games = [];
        let account = JSON.parse(localStorage.getItem('userAccount'));
        const SENHA_EXCLUSAO = "Al131210@";

        function navegarPara(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function realizarLogin() {
            const user = document.getElementById('loginUser').value.trim();
            
            if (user) {
                // Salva a conta atual na sessão para persistir para sempre
                account = { user };
                localStorage.setItem('userAccount', JSON.stringify(account));
                
                // Carrega os dados específicos deste usuário
                carregarDadosUsuario(user);
                
                document.getElementById('userNameDisplay').innerText = `Olá, ${user}!`;
                navegarPara('appPage');
                renderUI();
            } else {
                alert("Por favor, digite um nome de usuário.");
            }
        }

        function carregarDadosUsuario(username) {
            // Carrega os jogos específicos para este usuário, isolando os dados
            games = JSON.parse(localStorage.getItem('myGames_' + username)) || [];
        }

        function handleLogout() {
            localStorage.removeItem('userAccount');
            location.reload(); // Recarrega para voltar à tela de login
        }

        function saveToLocalStorage() {
            if (account) {
                localStorage.setItem('myGames_' + account.user, JSON.stringify(games));
                renderUI();
            }
        }

        window.addGame = (event) => {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const link = document.getElementById('gameLink').value.startsWith('http') ? document.getElementById('gameLink').value : 'https://' + document.getElementById('gameLink').value;
            const fileInput = document.getElementById('imgFile');
            
            const newGame = { id: Date.now(), title, link, img: '', hoursPlayed: 0, lastPlayed: null };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    newGame.img = e.target.result;
                    games.push(newGame);
                    saveToLocalStorage();
                    document.getElementById('modal').classList.add('hidden');
                    event.target.reset();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                games.push(newGame);
                saveToLocalStorage();
                document.getElementById('modal').classList.add('hidden');
                event.target.reset();
            }
        };

        window.removeGame = (id) => {
            const senha = prompt("Digite a senha para excluir:");
            if (senha === SENHA_EXCLUSAO) {
                games = games.filter(g => g.id !== id);
                saveToLocalStorage();
            } else if (senha !== null) {
                alert("Senha incorreta!");
            }
        };

        function renderUI() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'bg-white p-3 rounded-xl shadow-md cursor-pointer hover:shadow-lg transition border border-gray-100 flex flex-col h-full';
                card.onclick = () => openGame(game);
                card.innerHTML = `
                    <img src="${game.img || 'https://placehold.co/200x200/gray/white?text=Sem+Imagem'}" class="w-full h-32 object-cover rounded-lg">
                    <h3 class="font-bold text-md mt-2 truncate">${game.title}</h3>
                    <div class="text-xs text-gray-500 mt-1">
                        <p>⏱️ ${parseFloat(game.hoursPlayed || 0).toFixed(1)}h</p>
                    </div>
                    <button onclick="event.stopPropagation(); removeGame(${game.id})" class="text-red-500 text-xs w-full mt-auto pt-2 hover:underline">Excluir</button>
                `;
                grid.appendChild(card);
            });
        }

        function openGame(game) {
            const startTime = Date.now();
            document.getElementById('playModal').classList.remove('hidden');
            document.getElementById('gameIframe').src = game.link;
            document.getElementById('modalTitle').innerText = game.title;
            document.getElementById('externalLink').href = game.link;

            window.closeGame = () => {
                const endTime = Date.now();
                const duration = (endTime - startTime) / (1000 * 60 * 60);
                game.hoursPlayed = (parseFloat(game.hoursPlayed || 0) + duration).toFixed(2);
                game.lastPlayed = new Date().toLocaleDateString();
                saveToLocalStorage();
                document.getElementById('playModal').classList.add('hidden');
                document.getElementById('gameIframe').src = '';
            };
        }

        // --- STREAMING_CHUNK:Inicializando verificação de login persistente ---
        window.onload = () => {
            if (account) {
                document.getElementById('userNameDisplay').innerText = `Olá, ${account.user}!`;
                carregarDadosUsuario(account.user);
                navegarPara('appPage');
                renderUI();
            }
        };
    </script>

    <!-- Modais -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <form class="bg-white p-6 rounded-xl w-full max-w-sm" onsubmit="addGame(event)">
            <h2 class="text-lg font-bold mb-4">Adicionar Jogo</h2>
            <input type="text" id="title" placeholder="Nome" class="w-full p-2 border mb-2 rounded" required>
            <input type="text" id="gameLink" placeholder="Link (URL)" class="w-full p-2 border mb-2 rounded" required>
            <label class="block text-sm font-bold mb-2">Imagem:</label>
            <input type="file" id="imgFile" accept="image/*" class="w-full p-2 border mb-4 rounded">
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">Salvar Jogo</button>
        </form>
    </div>

    <div id="playModal" class="fixed inset-0 bg-black hidden flex flex-col z-50">
        <div class="p-4 flex justify-between items-center text-white">
            <h2 id="modalTitle" class="font-bold"></h2>
            <div class="flex gap-3">
                <a id="externalLink" href="#" target="_blank" class="bg-blue-600 px-3 py-1 rounded text-sm hover:bg-blue-700">Nova Aba</a>
                <button onclick="closeGame()" class="bg-red-600 px-3 py-1 rounded text-sm hover:bg-red-700">Fechar</button>
            </div>
        </div>
        <iframe id="gameIframe" class="flex-grow w-full border-none bg-white"></iframe>
    </div>
</body>
</html>
